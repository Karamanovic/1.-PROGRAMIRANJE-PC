<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedmični raspored rezervacije sale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header-card">
            <div class="header-content">
                <div class="header-title">
                    <div class="calendar-icon">📅</div>
                    <div class="title-text">
                        <h1>Sedmični raspored rezervacije sale</h1>
                        <p id="weekRange">Upravljanje rezervacijama prostorija</p>
                    </div>
                </div>
                
                <div class="header-controls">
                    <div class="select-container">
                        <select id="userSelect" class="select" aria-label="Odabir korisnika">
                            <!-- Users will be populated by JS -->
                        </select>
                    </div>
                    
                    <div class="select-container">
                        <select id="filterSelect" class="select" aria-label="Filter korisnika">
                            <option value="all">Svi korisnici</option>
                            <!-- Filter options will be populated by JS -->
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="navigation-controls">
            <div class="week-nav">
                <button id="prevWeek" class="btn">◀</button>
                <button id="currentWeek" class="btn btn-primary">Trenutna sedmica</button>
                <button id="nextWeek" class="btn">▶</button>
            </div>
            
            <div class="action-buttons">
                <button id="exportBtn" class="btn">📥 Eksport JSON</button>
                <label for="importFile" class="btn" style="cursor: pointer;">📤 Import JSON</label>
                <input type="file" id="importFile" accept=".json">
                <button id="undoBtn" class="btn">↩️ Vrati</button>
                <button id="clearBtn" class="btn">🗑️ Obriši sve</button>
            </div>
        </div>

        <!-- Active User Display -->
        <div class="active-user">
            <div id="activeUserColor" class="user-color"></div>
            <span>Aktivni korisnik: <span id="activeUserName"></span></span>
        </div>

        <!-- Calendar -->
        <div class="calendar-container">
            <div class="calendar-scroll">
                <div id="calendar" class="calendar-grid">
                    <!-- Calendar will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-content">
                <span style="font-weight: 600;">Korisnici:</span>
                <div id="userLegend">
                    <!-- Legend items will be populated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
