<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeElectroKeeper - Device Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /*
        ===========================================
        HOMEELECTROKEEPER - DEVICE MANAGEMENT SYSTEM
        ===========================================
        
        README:
        This is a single-file, offline-first home device management system.
        
        DEPLOYMENT:
        - Simply open this HTML file in any modern web browser
        - No server setup required - works entirely client-side
        - Data is stored in browser's localStorage
        
        BACKUP/RESTORE:
        - Use Export JSON feature to backup all data
        - Use Import JSON to restore from backup
        - Export CSV for spreadsheet compatibility
        
        SCHEMA:
        - Device: id, name, category, brand, model, serial, purchaseDate, price, warrantyMonths, notes, files, serviceHistory
        - ServiceEntry: id, serviceDate, description, performedBy, difficulty, toolsRequired, cost
        
        EXTENDING:
        - All code is in this single file for easy modification
        - Add new categories in DEVICE_CATEGORIES array
        - Extend DIY guides in DIY_GUIDES object
        - Modify data schema in Device/ServiceEntry classes
        */

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .app-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .search-section {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            background: var(--background);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .search-wrapper {
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .filter-section {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .filter-select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--surface);
            font-size: 0.875rem;
        }

        .devices-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .device-item {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.2s;
        }

        .device-item:hover {
            background-color: var(--background);
        }

        .device-item.active {
            background-color: #eff6ff;
            border-right: 3px solid var(--primary-color);
        }

        .device-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .device-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            gap: 1rem;
        }

        .warranty-status {
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .warranty-valid {
            background: #dcfce7;
            color: var(--success-color);
        }

        .warranty-expired {
            background: #fee2e2;
            color: var(--danger-color);
        }

        .warranty-expiring {
            background: #fef3c7;
            color: var(--warning-color);
        }

        .add-device-btn {
            margin: 1rem 1.5rem;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .add-device-btn:hover {
            background: var(--primary-dark);
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .nav-tabs {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .nav-tab {
            flex: 1;
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .nav-tab:hover {
            background-color: var(--background);
            color: var(--text-primary);
        }

        .nav-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .main-header {
            padding: 1.5rem 2rem;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .main-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            margin-left: auto;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--surface);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--background);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .delete-service-btn {
            color: var(--danger-color);
        }

        .delete-service-btn:hover {
            background: #fee2e2;
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Cost Tracker Styles */
        .cost-tracker {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .cost-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .year-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .year-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            background: var(--surface);
            font-weight: 600;
        }

        .add-expense-btn {
            padding: 0.75rem 1.5rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-expense-btn:hover {
            background: var(--primary-dark);
        }

        .expenses-list {
            background: var(--surface);
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .expense-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-info {
            flex: 1;
        }

        .expense-description {
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .expense-date {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .expense-amount {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 1.125rem;
        }

        .expense-actions {
            display: flex;
            gap: 0.5rem;
        }

        .cost-summary {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .summary-card {
            text-align: center;
        }

        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .summary-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .device-detail {
            max-width: 800px;
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .device-info h2 {
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .device-category {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .device-actions {
            display: flex;
            gap: 0.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
        }

        .info-card h3 {
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .info-value {
            font-weight: 500;
        }

        /* Service History Styles */
        .service-section {
            margin-top: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .service-list {
            background: var(--surface);
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .service-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .service-item:last-child {
            border-bottom: none;
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .service-date {
            font-weight: 600;
            color: var(--primary-color);
        }

        .service-cost {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .service-description {
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }

        .service-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .difficulty-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .difficulty-easy {
            background: #dcfce7;
            color: var(--success-color);
        }

        .difficulty-medium {
            background: #fef3c7;
            color: var(--warning-color);
        }

        .difficulty-hard {
            background: #fee2e2;
            color: var(--danger-color);
        }

        .difficulty-expert {
            background: #f3e8ff;
            color: #7c3aed;
        }

        /* Service Status Styles */
        .service-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-icon {
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .service-status {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .status-done {
            border-left: 4px solid var(--success-color);
        }

        .status-done .status-icon {
            color: var(--success-color);
        }

        .status-done .service-status {
            color: var(--success-color);
        }

        .status-upcoming {
            border-left: 4px solid var(--primary-color);
        }

        .status-upcoming .status-icon {
            color: var(--primary-color);
        }

        .status-upcoming .service-status {
            color: var(--primary-color);
        }

        .status-overdue {
            border-left: 4px solid var(--danger-color);
        }

        .status-overdue .status-icon {
            color: var(--danger-color);
        }

        .status-overdue .service-status {
            color: var(--danger-color);
        }

        .service-tools {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        #deviceModal {
            z-index: 1000;
        }

        #serviceModal {
            z-index: 1001;
        }

        #expenseModal {
            z-index: 1002;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 0.5rem;
            max-width: 600px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-secondary {
            background: var(--background);
            color: var(--text-primary);
        }

        /* DIY Guide Styles */
        .diy-section {
            background: var(--surface);
            border-radius: 0.5rem;
            box-shadow: var(--shadow);
            margin-top: 2rem;
        }

        .diy-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .diy-content {
            padding: 1.5rem;
        }

        .diy-task {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }

        .diy-task:last-child {
            margin-bottom: 0;
        }

        .diy-task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .diy-task-title {
            font-weight: 600;
        }

        .professional-warning {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 0.375rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .professional-warning .warning-title {
            font-weight: 600;
            color: var(--warning-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tools-required {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .tools-required strong {
            color: var(--text-primary);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .main-content {
                height: calc(100vh - 300px);
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .device-header {
                flex-direction: column;
                gap: 1rem;
            }

            .device-actions {
                width: 100%;
                justify-content: flex-start;
            }
        }

        /* Print Styles */
        @media print {
            .sidebar,
            .main-header,
            .device-actions,
            .modal {
                display: none !important;
            }

            .main-content {
                margin: 0;
                box-shadow: none;
            }

            .content-area {
                padding: 0;
            }

            body {
                background: white;
            }
        }

        /* Accessibility */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        *:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast-success {
            border-left: 4px solid var(--success-color);
        }

        .toast-error {
            border-left: 4px solid var(--danger-color);
        }

        .toast-warning {
            border-left: 4px solid var(--warning-color);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1 class="app-title">
                    <i class="fas fa-tools"></i>
                    HomeElectroKeeper
                </h1>
                <p class="app-subtitle">Manage your home devices & maintenance</p>
            </div>

            <div class="search-section">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" class="search-input" 
                           placeholder="Search devices..." aria-label="Search devices">
                </div>
            </div>

            <div class="filter-section">
                <select id="categoryFilter" class="filter-select" aria-label="Filter by category">
                    <option value="">All Categories</option>
                </select>
            </div>

            <div class="devices-list" id="devicesList" role="list">
                <!-- Devices will be populated here -->
            </div>

            <button class="add-device-btn" id="addDeviceBtn" aria-label="Add new device">
                <i class="fas fa-plus"></i>
                Add Device
            </button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="nav-tabs">
                <button class="nav-tab active" id="deviceManagerTab" data-view="devices">
                    <i class="fas fa-tools"></i>
                    Device Manager
                </button>
                <button class="nav-tab" id="costTrackerTab" data-view="costs">
                    <i class="fas fa-euro-sign"></i>
                    Cost Tracker
                </button>
            </div>
            <div class="main-header">
                <h2 class="main-title" id="mainTitle">Select a device</h2>
                <div class="header-actions">
                    <button class="btn" id="exportJsonBtn" title="Export all data as JSON">
                        <i class="fas fa-download"></i>
                        Export JSON
                    </button>
                    <button class="btn" id="exportCsvBtn" title="Export devices summary as CSV">
                        <i class="fas fa-file-csv"></i>
                        Export CSV
                    </button>
                    <button class="btn" id="importJsonBtn" title="Import data from JSON">
                        <i class="fas fa-upload"></i>
                        Import JSON
                    </button>

        class Device {
            constructor(data = {}) {
                this.id = data.id || this.generateId();
                this.name = data.name || '';
                this.category = data.category || '';
                this.brand = data.brand || '';
                this.model = data.model || '';
                this.serial = data.serial || '';
                this.purchaseDate = data.purchaseDate || '';
                this.price = data.price || 0;
                this.warrantyMonths = data.warrantyMonths || 0;
                this.notes = data.notes || '';
                this.files = data.files || [];
                this.serviceHistory = (data.serviceHistory || []).map(s => new ServiceEntry(s));
            }

            generateId() {
                return 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            getWarrantyStatus() {
                if (!this.purchaseDate || !this.warrantyMonths) {
                    return { status: 'unknown', text: 'Unknown' };
                }

                const purchaseDate = new Date(this.purchaseDate);
                const warrantyEndDate = new Date(purchaseDate);
                warrantyEndDate.setMonth(warrantyEndDate.getMonth() + this.warrantyMonths);
                
                const now = new Date();
                const daysUntilExpiry = Math.ceil((warrantyEndDate - now) / (1000 * 60 * 60 * 24));

                if (daysUntilExpiry < 0) {
                    return { status: 'expired', text: 'Expired' };
                } else if (daysUntilExpiry <= 30) {
                    return { status: 'expiring', text: `${daysUntilExpiry} days left` };
                } else {
                    return { status: 'valid', text: `Valid until ${warrantyEndDate.toLocaleDateString()}` };
                }
            }

            addServiceEntry(serviceData) {
                const service = new ServiceEntry(serviceData);
                this.serviceHistory.unshift(service);
                return service;
            }

            deleteServiceEntry(serviceId) {
                const index = this.serviceHistory.findIndex(s => s.id === serviceId);
                if (index !== -1) {
                    this.serviceHistory.splice(index, 1);
                    return true;
                }
                return false;
            }

            toJSON() {
                return {
                    id: this.id,
                    name: this.name,
                    category: this.category,
                    brand: this.brand,
                    model: this.model,
                    serial: this.serial,
                    purchaseDate: this.purchaseDate,
                    price: this.price,
                    warrantyMonths: this.warrantyMonths,
                    notes: this.notes,
                    files: this.files,
                    serviceHistory: this.serviceHistory.map(s => s.toJSON())
                };
            }
        }

        class ServiceEntry {
            constructor(data = {}) {
                this.id = data.id || this.generateId();
                this.serviceDate = data.serviceDate || '';
                this.description = data.description || '';
                this.performedBy = data.performedBy || 'self';
                this.difficulty = data.difficulty || 'Easy';
                this.toolsRequired = Array.isArray(data.toolsRequired) 
                    ? data.toolsRequired 
                    : (data.toolsRequired || '').split(',').map(t => t.trim()).filter(t => t);
                this.cost = data.cost || 0;
            }

            generateId() {
                return 'service_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            toJSON() {
                return {
                    id: this.id,
                    serviceDate: this.serviceDate,
                    description: this.description,
                    performedBy: this.performedBy,
                    difficulty: this.difficulty,
                    toolsRequired: this.toolsRequired,
                    cost: this.cost
                };
            }
        }

        class Expense {
            constructor(data = {}) {
                this.id = data.id || this.generateId();
                this.date = data.date || '';
                this.amount = data.amount || 0;
                this.description = data.description || '';
                this.category = data.category || 'Maintenance';
            }

            generateId() {
                return 'expense_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            }

            toJSON() {
                return {
                    id: this.id,
                    date: this.date,
                    amount: this.amount,
                    description: this.description,
                    category: this.category
                };
            }
        }

                this.devices = [];

                this.loadData();

            loadData() {
                try {
                    const savedData = localStorage.getItem('homeElectroKeeper');
                    if (savedData) {
                        const parsed = JSON.parse(savedData);
                        this.devices = (parsed.devices || []).map(d => new Device(d));
                        this.expenses = (parsed.expenses || []).map(e => new Expense(e));
                    }
                } catch (error) {
                    console.error('Error loading data:', error);
                    this.showToast('Error loading saved data', 'error');
                }
            }

                try {

                        devices: this.devices.map(d => d.toJSON()),
                        expenses: this.expenses.map(e => e.toJSON()),
                        version: '1.0',
                        exportDate: new Date().toISOString()
                    };
                    const jsonString = JSON.stringify(data);
                    localStorage.setItem('homeElectroKeeper', jsonString);
                    
                    // Verify that data was actually saved
                    const saved = localStorage.getItem('homeElectroKeeper');
                    if (!saved) {
                        throw new Error('Data was not saved to localStorage');
                    }

                    console.error('Error saving data:', error);

                    this.addDevice(new Device(deviceData));
                });

                this.showToast('Sample devices added to get you started!', 'success');
            }

            addDevice(device) {
                this.devices.push(device);
                this.saveData();
                return device;
            }

            updateDevice(device) {
                const index = this.devices.findIndex(d => d.id === device.id);
                if (index !== -1) {
                    this.devices[index] = device;
                    this.saveData();
                    return true;
                }
                return false;
            }

            deleteDevice(deviceId) {
                const index = this.devices.findIndex(d => d.id === deviceId);
                if (index !== -1) {
                    this.devices.splice(index, 1);
                    this.saveData();
                    return true;
                }
                return false;
            }

            getFilteredDevices() {
                return this.devices.filter(device => {
                    const matchesSearch = !this.searchTerm || 
                        device.name.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                        device.brand.toLowerCase().includes(this.searchTerm.toLowerCase()) ||
                        device.model.toLowerCase().includes(this.searchTerm.toLowerCase());
                    
                    const matchesCategory = !this.categoryFilter || 
                        device.category === this.categoryFilter;
                    
                    return matchesSearch && matchesCategory;
                });
            }

            exportJSON() {
                const data = {
                    devices: this.devices.map(d => d.toJSON()),
                    expenses: this.expenses.map(e => e.toJSON()),
                    version: '1.0',
                    exportDate: new Date().toISOString()
                };
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `homeelectrokeeper-backup-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                this.showToast('Data exported successfully', 'success');
            }

            exportCSV() {
                const headers = ['Name', 'Category', 'Brand', 'Model', 'Purchase Date', 'Price', 'Warranty Status', 'Last Service'];
                const rows = this.devices.map(device => {
                    const warranty = device.getWarrantyStatus();
                    const lastService = device.serviceHistory.length > 0 
                        ? device.serviceHistory[0].serviceDate 
                        : 'Never';
                    
                    return [
                        device.name,
                        device.category,
                        device.brand,
                        device.model,
                        device.purchaseDate,
                        device.price,
                        warranty.text,
                        lastService
                    ];
                });

                const csvContent = [headers, ...rows]
                    .map(row => row.map(field => `"${field}"`).join(','))
                    .join('\
');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `homeelectrokeeper-devices-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                this.showToast('CSV exported successfully', 'success');
            }

            importJSON(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        
                        if (!data.devices || !Array.isArray(data.devices)) {
                            throw new Error('Invalid file format');
                        }

                        // Ask for confirmation before importing
                        if (confirm(`This will replace all existing data with ${data.devices.length} devices and ${data.expenses?.length || 0} expenses from the backup. Continue?`)) {
                            this.devices = data.devices.map(d => new Device(d));
                            this.expenses = (data.expenses || []).map(e => new Expense(e));
                            this.saveData();
                            this.currentDevice = null;
                            if (window.app) window.app.render();
                            this.showToast(`Successfully imported ${this.devices.length} devices and ${this.expenses.length} expenses`, 'success');
                        }
                    } catch (error) {
                        console.error('Import error:', error);
                        this.showToast('Error importing file: ' + error.message, 'error');
                    }
                };
                reader.readAsText(file);
            }

            // Expense management methods
            getExpensesForYear(year) {
                return this.expenses.filter(expense => {
                    const expenseYear = new Date(expense.date).getFullYear();
                    return expenseYear === year;
                });
            }

            getTotalExpensesForYear(year) {
                return this.getExpensesForYear(year).reduce((total, expense) => total + expense.amount, 0);
            }

            addExpense(expenseData) {
                const expense = new Expense(expenseData);
                this.expenses.unshift(expense);
                this.saveData();
                return expense;
            }

            deleteExpense(expenseId) {
                const index = this.expenses.findIndex(e => e.id === expenseId);
                if (index !== -1) {
                    this.expenses.splice(index, 1);
                    this.saveData();
                    return true;
                }
                return false;
            }

            showToast(message, type = 'success') {
                // Remove existing toasts
                const existing = document.querySelector('.toast');
                if (existing) {
                    existing.remove();
                }

                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i>
                        <span>${message}</span>
                    </div>
                `;
                
                document.body.appendChild(toast);
                
                // Show toast
                setTimeout(() => toast.classList.add('show'), 100);
                
                // Hide toast
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // ===================================
        // APPLICATION CONTROLLER
        // ===================================

        class App {
            constructor() {
                this.state = new AppState();
                this.currentView = 'devices'; // 'devices' or 'costs'
                this.initializeElements();
                this.bindEvents();
                this.populateCategories();
                // Don't call render here - it will be called after window.app is set
                
                // Auto-save every 30 seconds and on window unload
                this.setupAutoSave();
            }
            
            init() {
                this.render();
            }
            
            setupAutoSave() {
                // Auto-save every 30 seconds
                setInterval(() => {
                    this.state.saveData();
                }, 30000);
                
                // Save before closing
                window.addEventListener('beforeunload', () => {
                    this.state.saveData();
                });
                
                // Save on visibility change (when tab becomes inactive)
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.state.saveData();
                    }
                });
            }

            initializeElements() {
                // Sidebar elements
                this.sidebar = document.querySelector('.sidebar');
                this.searchInput = document.getElementById('searchInput');
                this.categoryFilter = document.getElementById('categoryFilter');
                this.devicesList = document.getElementById('devicesList');
                this.addDeviceBtn = document.getElementById('addDeviceBtn');

                // Main content elements
                this.mainTitle = document.getElementById('mainTitle');
                this.contentArea = document.getElementById('contentArea');

                // Header actions
                this.exportJsonBtn = document.getElementById('exportJsonBtn');
                this.exportCsvBtn = document.getElementById('exportCsvBtn');
                this.importJsonBtn = document.getElementById('importJsonBtn');
                this.importFileInput = document.getElementById('importFileInput');
                this.clearAllBtn = document.getElementById('clearAllBtn');

                // Device modal elements
                this.deviceModal = document.getElementById('deviceModal');
                this.deviceForm = document.getElementById('deviceForm');
                this.closeDeviceModalBtn = document.getElementById('closeDeviceModal');
                this.cancelDeviceModalBtn = document.getElementById('cancelDeviceModal');
                this.saveDeviceBtn = document.getElementById('saveDeviceBtn');

                // Service modal elements
                this.serviceModal = document.getElementById('serviceModal');
                this.serviceForm = document.getElementById('serviceForm');
                this.closeServiceModalBtn = document.getElementById('closeServiceModal');
                this.cancelServiceModalBtn = document.getElementById('cancelServiceModal');

                this.costTrackerTab = document.getElementById('costTrackerTab');

                this.expenseModal = document.getElementById('expenseModal');
                this.expenseForm = document.getElementById('expenseForm');
                this.closeExpenseModalBtn = document.getElementById('closeExpenseModal');
                this.cancelExpenseModalBtn = document.getElementById('cancelExpenseModal');
                this.saveExpenseBtn = document.getElementById('saveExpenseBtn');
            }

            bindEvents() {
                // Search and filter
                this.searchInput.addEventListener('input', (e) => {
                    this.state.searchTerm = e.target.value;
                    this.renderDevicesList();
                });

                this.categoryFilter.addEventListener('change', (e) => {
                    this.state.categoryFilter = e.target.value;
                    this.renderDevicesList();
                });

                // Add device
                this.addDeviceBtn.addEventListener('click', () => this.openDeviceModal());

                // Export/Import
                this.exportJsonBtn.addEventListener('click', () => this.state.exportJSON());
                this.exportCsvBtn.addEventListener('click', () => this.state.exportCSV());
                this.importJsonBtn.addEventListener('click', () => this.importFileInput.click());
                this.importFileInput.addEventListener('change', (e) => {
                    if (e.target.files[0]) {
                        this.state.importJSON(e.target.files[0]);
                        e.target.value = '';
                    }
                });
                this.clearAllBtn.addEventListener('click', () => this.clearAllData());

                // Device modal
                if (this.closeDeviceModalBtn) {
                    this.closeDeviceModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeDeviceModal();
                    });
                }
                if (this.cancelDeviceModalBtn) {
                    this.cancelDeviceModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeDeviceModal();
                    });
                }
                this.deviceForm.addEventListener('submit', (e) => this.handleDeviceSubmit(e));

                // Service modal
                if (this.closeServiceModalBtn) {
                    this.closeServiceModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeServiceModal();
                    });
                }
                if (this.cancelServiceModalBtn) {
                    this.cancelServiceModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeServiceModal();
                    });
                }
                this.serviceForm.addEventListener('submit', (e) => this.handleServiceSubmit(e));

                // Click outside modal to close (only if service modal is not open)
                this.deviceModal.addEventListener('click', (e) => {
                    if (e.target === this.deviceModal && !this.serviceModal.classList.contains('active')) {
                        this.closeDeviceModal();
                    }
                });
                this.serviceModal.addEventListener('click', (e) => {
                    if (e.target === this.serviceModal) this.closeServiceModal();
                });

                // Keyboard shortcuts - close topmost modal first
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (this.expenseModal && this.expenseModal.classList.contains('active')) {
                            this.closeExpenseModal();
                        } else if (this.serviceModal.classList.contains('active')) {
                            this.closeServiceModal();
                        } else if (this.deviceModal.classList.contains('active')) {
                            this.closeDeviceModal();
                        }
                    }
                });

                // Navigation
                this.deviceManagerTab.addEventListener('click', () => this.switchView('devices'));
                this.costTrackerTab.addEventListener('click', () => this.switchView('costs'));

                // Expense modal
                if (this.closeExpenseModalBtn) {
                    this.closeExpenseModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeExpenseModal();
                    });
                }
                if (this.cancelExpenseModalBtn) {
                    this.cancelExpenseModalBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.closeExpenseModal();
                    });
                }
                this.expenseForm.addEventListener('submit', (e) => this.handleExpenseSubmit(e));

                // Click outside expense modal to close
                if (this.expenseModal) {
                    this.expenseModal.addEventListener('click', (e) => {
                        if (e.target === this.expenseModal) this.closeExpenseModal();
                    });
                }
            }

            populateCategories() {
                // Populate category filter
                DEVICE_CATEGORIES.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    this.categoryFilter.appendChild(option);
                });

                // Populate device modal category select
                const deviceCategorySelect = document.getElementById('deviceCategory');
                DEVICE_CATEGORIES.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category;
                    option.textContent = category;
                    deviceCategorySelect.appendChild(option);
                });

                    this.renderMainContent();

                    this.sidebar.style.display = 'none';
                    this.renderCostTracker();

                this.updateNavigation();
            }

                this.render();

                    deviceElement.setAttribute('role', 'listitem');
                    deviceElement.setAttribute('tabindex', '0');

            renderServiceHistory(device) {
                if (device.serviceHistory.length === 0) {
                    return `
                        <div class="service-list">
                            <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
                                <i class="fas fa-wrench" style="font-size: 2rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                                <p>No service history recorded</p>
                                <p style="font-size: 0.875rem;">Add your first service entry to start tracking maintenance.</p>
                            </div>
                        </div>
                    `;
                }

                const serviceItems = device.serviceHistory.map(service => {
                    const serviceDate = new Date(service.serviceDate);
                    const today = new Date();
                    const daysDiff = Math.ceil((serviceDate - today) / (1000 * 60 * 60 * 24));

                    let statusIcon = '✔';
                    let statusText = 'Done';
                    let statusClass = 'status-done';

                    if (daysDiff > 0) {
                        statusIcon = '⏳';
                        statusText = `Due in ${daysDiff} days`;
                        statusClass = 'status-upcoming';
                    } else if (daysDiff < -30) { // More than 30 days overdue
                        statusIcon = '⚠';
                        statusText = 'Overdue';
                        statusClass = 'status-overdue';
                    }

                    return `
                        <div class="service-item ${statusClass}">
                            <div class="service-header">
                                <div class="service-title">
                                    <span class="status-icon">${statusIcon}</span>
                                    <span class="service-description">${service.description}</span>
                                </div>
                                <div class="service-status">${statusText}</div>
                            </div>
                            <div class="service-meta">
                                <span>${new Date(service.serviceDate).toLocaleDateString()}</span>
                                <span>Performed by: ${service.performedBy}</span>
                                <span class="difficulty-badge difficulty-${service.difficulty.toLowerCase()}">${service.difficulty}</span>
                                ${service.cost ? `<span>${service.cost.toLocaleString()} KM</span>` : ''}
                            </div>
                            ${service.toolsRequired.length > 0 ? `
                                <div class="service-tools">
                                    <strong>Tools used:</strong> ${service.toolsRequired.join(', ')}
                                </div>
                            ` : ''}
                            <div style="margin-top: 0.5rem; display: flex; gap: 0.5rem;">
                                <button class="btn delete-service-btn" data-device-id="${device.id}" data-service-id="${service.id}" style="font-size: 0.75rem; padding: 0.25rem 0.5rem; color: var(--danger-color);">
                                    <i class="fas fa-trash"></i>
                                    Delete
                                </button>
                                <button class="btn download-ics-btn" data-service-id="${service.id}" style="font-size: 0.75rem; padding: 0.25rem 0.5rem;">
                                    <i class="fas fa-calendar-plus"></i>
                                    Add to Calendar
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');

                return `<div class="service-list">${serviceItems}</div>`;
            }

            renderDIYGuide(device) {
                let guides = [];
                const category = device.category;
                const name = device.name.toLowerCase();

                // For Kitchen Appliances, check device name to show specific guides
                if (category === 'Kitchen Appliances') {
                    if (name.includes('dishwasher') || name.includes('mašina za pranje suđa')) {
                        guides = DIY_GUIDES['Dishwasher'] || [];
                    } else if (name.includes('oven') || name.includes('pečnica') || name.includes('pećnica')) {
                        guides = DIY_GUIDES['Oven'] || [];
                    } else if (name.includes('induction') || name.includes('indukciona') || name.includes('ploča')) {
                        guides = DIY_GUIDES['Induction Plate'] || [];
                    } else if (name.includes('hood') || name.includes('kitchen hood')) {
                        // Show hood-specific guides from Kitchen Appliances
                        guides = DIY_GUIDES['Kitchen Appliances'].filter(guide =>
                            guide.title.toLowerCase().includes('hood') ||
                            guide.title.toLowerCase().includes('fan')
                        );
                    } else {
                        // Show general kitchen appliance guides
                        guides = DIY_GUIDES[category] || [];
                    }
                } else if (category === 'Laundry') {
                    if (name.includes('washing machine') || name.includes('weš mašina') || name.includes('veš mašina')) {
                        guides = DIY_GUIDES['Washing Machine'] || [];
                    } else {
                        guides = DIY_GUIDES[category] || [];
                    }
                } else {
                    // For other categories, use category-based lookup
                    guides = DIY_GUIDES[category] || [];
                }

                if (guides.length === 0) {
                    return '';
                }

                const guideItems = guides.map(guide => `
                    <div class="diy-task">
                        <div class="diy-task-header">
                            <div class="diy-task-title">${guide.title}</div>
                            <span class="difficulty-badge difficulty-${guide.difficulty.toLowerCase()}">${guide.difficulty}</span>
                        </div>
                        <div style="margin: 0.5rem 0; font-size: 0.875rem; color: var(--text-secondary);">
                            ${guide.steps}
                        </div>
                        ${guide.tools.length > 0 ? `
                            <div class="tools-required">
                                <strong>Tools required:</strong> ${guide.tools.join(', ')}
                            </div>
                        ` : ''}
                        ${guide.professional ? `
                            <div class="professional-warning">
                                <div class="warning-title">
                                    <i class="fas fa-exclamation-triangle"></i>
                                    Professional Recommended
                                </div>
                                <div>This task involves safety hazards or requires specialized knowledge. Consider hiring a professional.</div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                return `
                    <div class="diy-section">
                        <div class="diy-header">
                            <h3 class="section-title">
                                <i class="fas fa-tools"></i>
                                DIY Maintenance Guide - ${category}
                            </h3>
                        </div>
                        <div class="diy-content">
                            ${guideItems}
                        </div>
                    </div>
                `;
            }

            selectDevice(device) {
                this.state.currentDevice = device;
                this.renderMainContent();
                this.renderDevicesList(); // Re-render to update active state
            }

            renderCostTracker() {
                const year = this.state.currentYear;
                const expenses = this.state.getExpensesForYear(year);
                const totalCost = this.state.getTotalExpensesForYear(year);

                this.mainTitle.textContent = `${year} Expenses`;
                this.contentArea.innerHTML = `
                    <div class="cost-tracker">
                        <div class="cost-header">
                            <div class="year-selector">
                                <button class="btn" id="prevYearBtn" title="Previous year">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                                <select id="yearSelect" class="year-select">
                                    ${Array.from({length: 10}, (_, i) => {
                                        const y = new Date().getFullYear() - i;
                                        return `<option value="${y}" ${y === year ? 'selected' : ''}>${y}</option>`;
                                    }).join('')}
                                </select>
                                <button class="btn" id="nextYearBtn" title="Next year">
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                            <button class="add-expense-btn" id="addExpenseBtn">
                                <i class="fas fa-plus"></i>
                                Add Expense
                            </button>
                        </div>

                        <div class="expenses-list">
                            ${expenses.length === 0 ? `
                                <div style="padding: 3rem; text-align: center; color: var(--text-secondary);">
                                    <i class="fas fa-euro-sign" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.5;"></i>
                                    <h3>No expenses recorded for ${year}</h3>
                                    <p>Add your first expense to start tracking costs.</p>
                                </div>
                            ` : expenses.map(expense => `
                                <div class="expense-item">
                                    <div class="expense-info">
                                        <div class="expense-description">${expense.description}</div>
                                        <div class="expense-date">${new Date(expense.date).toLocaleDateString()}</div>
                                    </div>
                                    <div class="expense-amount">€${expense.amount.toFixed(2)}</div>
                                    <div class="expense-actions">
                                        <button class="btn delete-expense-btn" data-expense-id="${expense.id}" title="Delete expense" style="color: var(--danger-color);">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="cost-summary">
                            <div class="summary-card">
                                <div class="summary-value">€${totalCost.toFixed(2)}</div>
                                <div class="summary-label">Total ${year} Maintenance Cost</div>
                            </div>
                        </div>
                    </div>
                `;
                this.contentArea.innerHTML = html;
                
                // Add event listeners for dynamically created elements
                const addExpenseBtn = document.getElementById('addExpenseBtn');
                if (addExpenseBtn) {
                    addExpenseBtn.addEventListener('click', () => this.openExpenseModal());
                }
                
                // Add event listeners for year navigation
                const yearSelect = document.getElementById('yearSelect');
                if (yearSelect) {
                    yearSelect.addEventListener('change', (e) => this.changeYear(parseInt(e.target.value)));
                }
                
                const prevYearBtn = document.getElementById('prevYearBtn');
                if (prevYearBtn) {
                    prevYearBtn.addEventListener('click', () => this.changeYear(year - 1));
                }
                
                const nextYearBtn = document.getElementById('nextYearBtn');
                if (nextYearBtn) {
                    nextYearBtn.addEventListener('click', () => this.changeYear(year + 1));
                }
                
                // Add event listeners for delete expense buttons
                const deleteButtons = this.contentArea.querySelectorAll('.delete-expense-btn');
                deleteButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        const expenseId = e.currentTarget.getAttribute('data-expense-id');
                        this.deleteExpense(expenseId);
                    });
                });
            }

            changeYear(year) {
                this.state.currentYear = year;
                this.renderCostTracker();
            }

            openExpenseModal() {
                this.expenseForm.reset();
                document.getElementById('expenseDate').valueAsDate = new Date();
                this.expenseModal.classList.add('active');
                document.getElementById('expenseDescription').focus();
            }

            closeExpenseModal() {
                this.expenseModal.classList.remove('active');
            }

            handleExpenseSubmit(e) {
                e.preventDefault();
                
                const formData = new FormData(this.expenseForm);
                const expenseData = {
                    date: formData.get('expenseDate'),
                    amount: parseFloat(formData.get('expenseAmount')),
                    description: formData.get('expenseDescription'),
                    category: formData.get('expenseCategory')
                };

                this.state.addExpense(expenseData);
                this.closeExpenseModal();
                this.renderCostTracker();
                this.state.showToast('Expense added successfully', 'success');
            }

            deleteExpense(expenseId) {
                if (confirm('Are you sure you want to delete this expense?')) {
                    this.state.deleteExpense(expenseId);
                    this.renderCostTracker();
                    this.state.showToast('Expense deleted', 'success');
                }
            }

            openDeviceModal(device = null) {
                this.state.isEditing = !!device;
                this.state.editingDevice = device;
                
                const modalTitle = document.getElementById('deviceModalTitle');
                modalTitle.textContent = device ? 'Edit Device' : 'Add Device';
                
                // Reset form
                this.deviceForm.reset();
                
                if (device) {
                    // Populate form with device data
                    document.getElementById('deviceName').value = device.name || '';
                    document.getElementById('deviceCategory').value = device.category || '';
                    document.getElementById('deviceBrand').value = device.brand || '';
                    document.getElementById('deviceModel').value = device.model || '';
                    document.getElementById('deviceSerial').value = device.serial || '';
                    document.getElementById('devicePrice').value = device.price || '';
                    document.getElementById('purchaseDate').value = device.purchaseDate || '';
                    document.getElementById('warrantyMonths').value = device.warrantyMonths || '';
                    document.getElementById('deviceNotes').value = device.notes || '';
                }
                
                this.deviceModal.classList.add('active');
                document.getElementById('deviceName').focus();
            }

            closeDeviceModal() {
                this.deviceModal.classList.remove('active');
                this.state.isEditing = false;
                this.state.editingDevice = null;
                this.deviceForm.reset();
            }

            handleDeviceSubmit(e) {
                e.preventDefault();
                
                const formData = new FormData(this.deviceForm);
                const deviceData = {
                    name: document.getElementById('deviceName').value,
                    category: document.getElementById('deviceCategory').value,
                    brand: document.getElementById('deviceBrand').value,
                    model: document.getElementById('deviceModel').value,
                    serial: document.getElementById('deviceSerial').value,
                    price: parseFloat(document.getElementById('devicePrice').value) || 0,
                    purchaseDate: document.getElementById('purchaseDate').value,
                    warrantyMonths: parseInt(document.getElementById('warrantyMonths').value) || 0,
                    notes: document.getElementById('deviceNotes').value
                };

                if (this.state.isEditing && this.state.editingDevice) {
                    // Update existing device
                    const updatedDevice = new Device({
                        ...this.state.editingDevice.toJSON(),
                        ...deviceData
                    });
                    
                    this.state.updateDevice(updatedDevice);
                    
                    // Update current device if it's the one being edited
                    if (this.state.currentDevice?.id === updatedDevice.id) {
                        this.state.currentDevice = updatedDevice;
                    }
                    
                    this.state.showToast('Device updated successfully', 'success');
                } else {
                    // Add new device
                    const newDevice = new Device(deviceData);
                    this.state.addDevice(newDevice);
                    this.state.currentDevice = newDevice;
                    this.state.showToast('Device added successfully', 'success');
                }
                
                this.closeDeviceModal();
                this.render();
            }

            editDevice(deviceId) {
                const device = this.state.devices.find(d => d.id === deviceId);
                if (device) {
                    this.openDeviceModal(device);
                }
            }

            deleteDevice(deviceId) {
                if (confirm('Are you sure you want to delete this device? This action cannot be undone.')) {
                    this.state.deleteDevice(deviceId);
                    
                    if (this.state.currentDevice?.id === deviceId) {
                        this.state.currentDevice = null;
                    }
                    
                    this.render();
                    this.state.showToast('Device deleted successfully', 'success');
                }
            }

            printDevice() {
                window.print();
            }

            clearAllData() {
                if (confirm('Are you sure you want to delete ALL data? This cannot be undone. All devices, service history, and expenses will be erased.')) {
                    this.state.devices = [];
                    this.state.expenses = [];
                    this.state.currentDevice = null;
                    this.state.saveData();
                    this.render();
                    this.state.showToast('All data cleared successfully', 'success');
                }
            }

            openServiceModal(deviceId) {
                const device = this.state.devices.find(d => d.id === deviceId);
                if (!device) {
                    this.state.showToast('Error: Device not found', 'error');
                    return;
                }
                
                this.state.currentServiceDevice = device;
                
                // Reset form
                if (this.serviceForm) {
                    this.serviceForm.reset();
                }
                document.getElementById('serviceDate').value = new Date().toISOString().split('T')[0];
                
                this.serviceModal.classList.add('active');
                
                // Focus after a small delay to ensure modal is rendered
                setTimeout(() => {
                    const descElement = document.getElementById('serviceDescription');
                    if (descElement) {
                        descElement.focus();
                    }
                }, 100);
            }

            closeServiceModal() {
                this.serviceModal.classList.remove('active');
                this.state.currentServiceDevice = null;
            }

            handleServiceSubmit(e) {
                e.preventDefault();
                
                if (!this.state.currentServiceDevice) {
                    this.state.showToast('Error: No device selected for service', 'error');
                    return;
                }
                
                const toolsInput = document.getElementById('toolsRequired').value;
                const toolsArray = toolsInput ? toolsInput.split(',').map(t => t.trim()).filter(t => t) : [];
                
                const serviceData = {
                    serviceDate: document.getElementById('serviceDate').value,
                    description: document.getElementById('serviceDescription').value,
                    performedBy: document.getElementById('performedBy').value,
                    difficulty: document.getElementById('serviceDifficulty').value,
                    toolsRequired: toolsArray,
                    cost: parseFloat(document.getElementById('serviceCost').value) || 0
                };
                
                // Validate required fields
                if (!serviceData.serviceDate || !serviceData.description) {
                    this.state.showToast('Please fill in all required fields', 'error');
                    return;
                }

                // Add service entry to the device
                this.state.currentServiceDevice.addServiceEntry(serviceData);
                
                // Find the device in the array and update it to ensure proper reference
                const deviceIndex = this.state.devices.findIndex(d => d.id === this.state.currentServiceDevice.id);
                if (deviceIndex !== -1) {
                    this.state.devices[deviceIndex] = this.state.currentServiceDevice;
                    this.state.saveData();
                }
                
                // Update current device if it's the same
                if (this.state.currentDevice?.id === this.state.currentServiceDevice.id) {
                    this.state.currentDevice = this.state.currentServiceDevice;
                }
                
                this.closeServiceModal();
                this.renderMainContent();
                this.state.showToast('Service entry added successfully', 'success');
            }

            deleteService(deviceId, serviceId) {
                const device = this.state.devices.find(d => d.id === deviceId);
                if (!device) {
                    this.state.showToast('Error: Device not found', 'error');
                    return;
                }

                if (confirm('Are you sure you want to delete this service entry? This action cannot be undone.')) {
                    if (device.deleteServiceEntry(serviceId)) {
                        // Update device in state
                        const deviceIndex = this.state.devices.findIndex(d => d.id === deviceId);
                        if (deviceIndex !== -1) {
                            this.state.devices[deviceIndex] = device;
                            this.state.saveData();
                        }

                        // Update current device if it's the same
                        if (this.state.currentDevice?.id === deviceId) {
                            this.state.currentDevice = device;
                        }

                        this.renderMainContent();
                        this.state.showToast('Service entry deleted successfully', 'success');
                    } else {
                        this.state.showToast('Error: Service entry not found', 'error');
                    }
                }
            }

            downloadICS(serviceId) {
                const device = this.state.currentDevice;
                if (!device) return;
                
                const service = device.serviceHistory.find(s => s.id === serviceId);
                if (!service) return;
                
                const serviceDate = new Date(service.serviceDate);
                const reminderDate = new Date(serviceDate);
                reminderDate.setFullYear(reminderDate.getFullYear() + 1); // Set reminder for 1 year later
                
                const formatDate = (date) => {
                    return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
                };
                
                const icsContent = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//HomeElectroKeeper//Service Reminder//EN
BEGIN:VEVENT
UID:${service.id}@homeelectrokeeper
DTSTART:${formatDate(reminderDate)}
DTEND:${formatDate(new Date(reminderDate.getTime() + 60 * 60 * 1000))}
SUMMARY:Service Reminder: ${device.name}
DESCRIPTION:Time for next service on ${device.name}\\\
Last service: ${service.description}\\\
Difficulty: ${service.difficulty}\\\
Tools: ${service.toolsRequired.join(', ')}
LOCATION:Home
BEGIN:VALARM
TRIGGER:-P7D
ACTION:DISPLAY
DESCRIPTION:Service reminder for ${device.name}
END:VALARM
END:VEVENT
END:VCALENDAR`;
                
                const blob = new Blob([icsContent], { type: 'text/calendar' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${device.name}-service-reminder.ics`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                this.state.showToast('Calendar reminder downloaded', 'success');
            }
        }

        // ===================================
        // APPLICATION INITIALIZATION
        // ===================================

        let app;
        window.app = null;

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new App();
            window.app.init();
        });

    </script>
