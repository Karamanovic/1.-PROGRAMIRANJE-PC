<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sedmični Raspored Sale</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
background: #f4f4f9;
color: #333;
}
h1 {
text-align: center;
margin-bottom: 20px;
}
table {
border-collapse: collapse;
width: 100%;
table-layout: fixed;
}
th, td {
border: 1px solid #ccc;
text-align: center;
padding: 5px;
font-size: 12px;
}
th {
background: #eee;
}
td.slot {
cursor: pointer;
}
.user1 { background: #ffcccc; }
.user2 { background: #ccffcc; }
.user3 { background: #ccccff; }
.user4 { background: #fff0b3; }
.user5 { background: #ffccff; }
.controls {
margin: 20px 0;
text-align: center;
}
select, button {
margin: 5px;
padding: 5px 10px;
}
</style>
</head>
<body>
<h1>Sedmični Raspored Sale</h1>


<div class="controls">
<label for="userSelect">Odaberi korisnika: </label>
<select id="userSelect">
<option value="user1">Korisnik 1</option>
<option value="user2">Korisnik 2</option>
<option value="user3">Korisnik 3</option>
<option value="user4">Korisnik 4</option>
<option value="user5">Korisnik 5</option>
